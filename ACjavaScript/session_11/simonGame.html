<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Simon Says Game</h1>
    <h2>Press any key to start the game</h2>

    <div class="btn-container">
        <div class="line-one">
            <div id="red" type="button" class="btn red">1</div>
            <div id="yellow" type="button" class="btn yellow">2</div>

        </div>

        <div class="line-two">
            <div id="green" type="button" class="btn green">3</div>
            <div id="purple" type="button" class="btn purple">4</div>
        </div>
    </div>

    <script src="simonGame.js"></script>
</body>

</html>
